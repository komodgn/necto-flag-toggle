<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>Flag Toggle</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <main class="necto-app">
      <div class="necto-body">
        <h1 class="necto-section-title" id="title">Flag Toggle</h1>

        <div class="necto-section">
            <span class="necto-row-label" data-i18n="Current" style="display: block; margin-bottom: 4px; color: var(--necto-text-muted);">Current</span>
            <span class="necto-row-value" id="state" data-i18n="Waiting…" style="display: block; font-weight: 600;">Waiting…</span>
        </div>

        <div class="necto-actions">
          <button class="necto-button necto-button-primary" id="toggle" type="button" data-i18n="Toggle">Toggle</button>
          <button class="necto-button" id="enable" type="button">ON</button>
          <button class="necto-button" id="disable" type="button">OFF</button>
        </div>

        <p class="necto-caption" id="note"></p>
      </div>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
